<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>三角洲专属灵敏度生成器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
:root{--primary:#2596ff;--accent:#ffb020;--bg:#0b0f17;--card:#161c28;--text:#e8edf2;--gray:#a0a8b8}
body{background:#0b0f17;color:#e8edf2;padding:16px;min-height:100vh}
.page{display:none;padding:16px;height:100%}
.page.active{display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin-bottom:12px;color:#fff;text-align:center}
h2{font-size:18px;margin-bottom:8px;color:var(--primary)}
.desc{color:#a0a8b8;font-size:14px;text-align:center}
.card{background:var(--card);border-radius:14px;padding:16px}
.item{margin:10px 0}
label{display:block;margin-bottom:4px;font-size:15px}
input{width:100%;padding:10px;border-radius:8px;border:none;background:#222a38;color:#fff;font-size:16px}
.btn{width:100%;padding:12px;border-radius:10px;border:none;font-size:16px;font-weight:bold;cursor:pointer;margin-top:8px}
.btn-blue{background:var(--primary);color:#fff}
.btn-yellow{background:var(--accent);color:#000}
.result-box{background:#222a38;padding:14px;border-radius:10px;margin-top:10px;white-space:pre-line}
</style>
</head>
<body>
<div id="page1" class="page active">
<h1>三角洲行动｜4指猛攻灵敏度</h1>
<p class="desc">填入你的手感，生成专属灵敏度</p>
<div class="card">
<div class="item">
<label>全局灵敏度</label>
<input type="number" id="global" value="72">
</div>
<div class="item">
<label>开镜灵敏度</label>
<input type="number" id="ads" value="65">
</div>
<div class="item">
<label>陀螺仪全局</label>
<input type="number" id="gyroAll" value="2.2" step="0.1">
</div>
<div class="item">
<label>陀螺仪开镜</label>
<input type="number" id="gyroAds" value="1.8" step="0.1">
</div>
</div>
<button class="btn btn-blue" onclick="gen()">生成灵敏度</button>
<div class="card">
<h2>生成结果</h2>
<div class="result-box" id="res"></div>
<button class="btn btn-yellow" onclick="copyText()">一键复制</button>
</div>
</div>
<script>
function gen(){
let g=document.getElementById('global').value;
let a=document.getElementById('ads').value;
let ga=document.getElementById('gyroAll').value;
let gad=document.getElementById('gyroAds').value;
let str=`【三角洲行动 4指猛攻】
全局灵敏度：${g}
开镜灵敏度：${a}
陀螺仪全局：${ga}
陀螺仪开镜：${gad}
小提示：靶场微调，快就降低数值，慢就提高`;
document.getElementById('res').innerText=str;
}
function copyText(){
let txt=document.getElementById('res').innerText;
navigator.clipboard.writeText(txt).then(()=>alert("复制成功！"))
}
</script>
</body>
</html>
